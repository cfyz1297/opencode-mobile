name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node >= 23.6 runs the TypeScript test files natively (type-stripping),
          # matching the local toolchain. No build step or extra deps required.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check release version metadata
        run: npm run check:versions

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_CHATWOOT_INBOX_IDENTIFIER: ${{ secrets.EXPO_PUBLIC_CHATWOOT_INBOX_IDENTIFIER }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Setup signing
        # Fork: sign EVERY build (not just tag refs) with the persistent
        # keystore from repo secrets, so updates install over previous
        # versions. A debug keystore generated fresh per run changes signature
        # every build and Android refuses to update over an installed app.
        run: |
          if [[ -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Signing: production keystore"
          else
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Signing: debug keystore (keystore secret not set)"
          fi

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify package, version and update signature
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | head -1 > /tmp/current-apk.txt
          cat /tmp/current-apk.txt
          grep -q "name='cc.agentlabs.opencode'" /tmp/current-apk.txt
          grep -q "versionCode='54'" /tmp/current-apk.txt
          grep -q "versionName='0.2.20'" /tmp/current-apk.txt
          curl --fail --location --retry 2 -o /tmp/previous.apk https://github.com/cfyz1297/opencode-mobile/releases/latest/download/opencode-mobile-v2.apk
          "$SIGNER" verify --print-certs /tmp/previous.apk | grep 'Signer #1 certificate SHA-256 digest:' > /tmp/previous-cert.txt
          "$SIGNER" verify --print-certs "$APK" | grep 'Signer #1 certificate SHA-256 digest:' > /tmp/current-cert.txt
          diff -u /tmp/previous-cert.txt /tmp/current-cert.txt
          echo 'Package/version verified; signing certificate matches the published app.'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

  roadmap-smoke:
    name: Android roadmap CUA smoke
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v7
        with:
          name: app-release
          path: artifacts/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run release APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r artifacts/apk/app-release.apk
            node scripts/cua-roadmap-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: roadmap-smoke-evidence
          path: artifacts/roadmap

